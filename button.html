<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Trip Button</title>
  <link rel="stylesheet" href="assets/fontawesome/css/all.css">
	<style>
    body {
      margin: 0;
    }

    #bookmark_button {
			cursor: pointer;
			position: fixed;
			z-index: 50;
      background: rgb(255, 255, 255);
      padding: 0.5em;
      max-width: 8ch;
      display: flex;
      gap: 0.5em;
      flex-direction: column;
      /* border-radius: 1em; */
      /* box-shadow: 0 0 5px rgba(0, 0, 0, 0.3); */
      margin: 5px;
      --icon-color: #999999;
    }

		#bookmark_button.bookmark_button-on {
      --icon-color: #F5B324;
    }

    #bookmark_button .my-trip-text {
      text-align: center;
      font-size: 13px;
      line-height: 1.1;
      font-family: "Meso", sans-serif;
    }

    .heart-container {
      position: relative;
    }

    .fa-heart {
      font-size: 32px;
      text-align: center;
      width: 100%;
      color: var(--icon-color);
    }

    .fa-minus,
    .fa-plus {
      position: absolute;
      z-index: 10;
      top: 58%;
      left: 75%;
      transform: translate(-50%, -50%);
      color: white;
      font-size: 10px;
      background: var(--icon-color);
      padding: 2px;
      border-radius: 100px;
      border: 1px solid white;
      height: 1em;
      width: 1em;
      text-align: center;
    }

    .fa-minus {
      display: none;
    }

    #bookmark_button.bookmark_button-on .fa-plus {
      display: none;
    }

    #bookmark_button.bookmark_button-on .fa-minus {
      display: block;
    }

	</style>

</head>
<body>
  <div id="bookmark_button">
    <div class="heart-container">
		  <i class="fas fa-heart"></i>
		  <i class="fas fa-minus"></i>
		  <i class="fas fa-plus"></i>
    </div>
    <div class="my-trip-text">My Trip</div>
  </div>
  <script>
    addEventListener("DOMContentLoaded", (event) => {

      const urlParams = new URLSearchParams(window.location.search);

      const bookmark = {
        domain: urlParams.get("domain"),
        postID: urlParams.get("post_id"),
        postType: urlParams.get("post_type"),
      };

      const bookmarkEquality = function(b1, b2) {
        return b1.domain == b2.domain && b1.postID == b2.postID && b1.postType == b2.postType;
      }

      const bookmark_button = document.getElementById("bookmark_button");

      const refresh = function () {

        let bookmarks = getCookie("wp_bookmarks");
        if (bookmarks == "") {
          bookmarks = [];
        } else {
          bookmarks = JSON.parse(bookmarks);
        }


        // let bookmarks = [];
        // if (!localStorage.key("wp_storage")) {
        //   localStorage.setItem("wp_bookmarks", JSON.stringify([]));
        // } else {
        //   bookmarks = JSON.parse(localStorage.getItem("wp_bookmarks"))
        // }

        if (bookmarks.find((b) => bookmarkEquality(b, bookmark)) != undefined) {
          // bookmark_button.innerHTML = "Remove Bookmark";
          bookmark_button.classList.add("bookmark_button-on");
        } else {
          // bookmark_button.innerHTML = "Add Bookmark";
          bookmark_button.classList.remove("bookmark_button-on");
        }
      };

      refresh();

      function setCookie(cname, cvalue, exdays) {
        const d = new Date();
        const hostname = window.location.hostname;
        const match = hostname.match(/[\w]*\.(com|io)/);
        const domain = (match) ? match[0] : false;
        d.setTime(d.getTime() + (exdays*24*60*60*1000));
        const expires = "expires="+ d.toUTCString();
        let cookie = cname + "=" + cvalue + ";" + expires + ";path=/;";
        if (domain) {
          cookie += ` Domain=${domain}`;
        }
        document.cookie = cookie;
      }

      function getCookie(cname) {
        let name = cname + "=";
        let decodedCookie = decodeURIComponent(document.cookie);
        let ca = decodedCookie.split(';');
        for(let i = 0; i <ca.length; i++) {
          let c = ca[i];
          while (c.charAt(0) == ' ') {
            c = c.substring(1);
          }
          if (c.indexOf(name) == 0) {
            return c.substring(name.length, c.length);
          }
        }
        return "";
      }

      bookmark_button.addEventListener("click", function () {

        // let bookmarks = [];
        // if (!localStorage.key("wp_storage")) {
        //   localStorage.setItem("wp_bookmarks", JSON.stringify([]));
        // } else {
        //   bookmarks = JSON.parse(localStorage.getItem("wp_bookmarks"))
        // }

        let bookmarks = getCookie("wp_bookmarks");
        if (bookmarks == "") {
          bookmarks = [];
        } else {
          bookmarks = JSON.parse(bookmarks);
        }
        const index = bookmarks.findIndex((b) => bookmarkEquality(b, bookmark));
        if (index == -1) {
          bookmarks.push(bookmark);
        } else {
          bookmarks.splice(index, 1);
        }

        setCookie("wp_bookmarks", JSON.stringify(bookmarks), 365);
        // localStorage.setItem("wp_bookmarks", JSON.stringify(bookmarks));

        if (bookmarks.find((b) => bookmarkEquality(b, bookmark)) != undefined) {
          // bookmark_button.innerHTML = "Remove Bookmark";
          bookmark_button.classList.add("bookmark_button-on");
        } else {
          // bookmark_button.innerHTML = "Add Bookmark";
          bookmark_button.classList.remove("bookmark_button-on");
        }
      });
    });
  </script>

</body>
</html>
